[project]
name = "agentforge-mcp-demo"
version = "0.1.0"
description = "Minimal MCP server that exposes the harness file tools over the wire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentforge",
  "mcp>=1.12,<2",
]

[tool.uv.sources]
# The demo is a thin adapter over the harness tools, so it depends on that package
# instead of reaching into `../harness/src` through the current working directory.
agentforge = { path = "../harness", editable = true }

[tool.uv]
# No wheel: this is a script service started by docker-compose and by the tests.
package = false
